<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нумерология — подарочная грамота</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Georgia','Times New Roman',serif; background:linear-gradient(160deg,#0d0a1f 0%,#1b1035 45%,#2a1448 100%); color:#efeafb; min-height:100vh; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 16px 60px; }
  header { text-align:center; margin-bottom:28px; }
  header h1 { font-size:2.1rem; color:#ffd166; letter-spacing:2px; font-family:'Georgia',serif; }
  header p { color:rgba(239,234,251,.7); margin-top:6px; font-size:1rem; }

  .form-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,209,102,.25); border-radius:16px; padding:24px; margin-bottom:28px; font-family:'Segoe UI',Arial,sans-serif; }
  label { display:block; font-size:.9rem; color:#ffd166; margin-bottom:6px; font-weight:600; }
  input[type=date], input[type=text], input[type=number] { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; font-size:1.05rem; }
  input[type=text] { margin-bottom:14px; }
  input::placeholder { color:rgba(239,234,251,.4); }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row .col { flex:1; min-width:150px; }
  button { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#ffd166,#f4a261); color:#2a1448; font-size:1.1rem; font-weight:700; cursor:pointer; margin-top:18px; transition:transform .15s; font-family:'Segoe UI',Arial,sans-serif; }
  button:hover { transform:translateY(-2px); }

  /* ============ ГРАМОТА ============ */
  .diploma-wrap { display:none; }
  .diploma-wrap.show { display:block; animation:fade .6s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

  .diploma {
    position:relative;
    background:
      radial-gradient(circle at 50% 15%, rgba(255,214,130,.15), transparent 60%),
      linear-gradient(155deg,#fdf6e3 0%, #f7ecc8 45%, #f3e3b3 100%);
    color:#4a3512;
    border-radius:20px;
    padding:60px 42px 40px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .diploma::before {
    content:""; position:absolute; inset:14px; border:2px solid rgba(190,145,50,.55); border-radius:12px; pointer-events:none;
  }
  .diploma::after {
    content:""; position:absolute; inset:20px; border:1px solid rgba(190,145,50,.35); border-radius:8px; pointer-events:none;
  }
  .ribbon {
    position:absolute; top:-22px; left:50%; transform:translateX(-50%) rotate(-3deg);
    background:linear-gradient(135deg,#c0392b,#e74c3c); color:#fff; font-family:'Segoe UI',Arial,sans-serif;
    font-weight:800; font-size:1.05rem; letter-spacing:3px; text-transform:uppercase;
    padding:10px 32px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.35); white-space:nowrap;
  }
  .ribbon::before, .ribbon::after { content:"✦"; position:absolute; font-size:.8rem; top:50%; transform:translateY(-50%); color:#ffd166; }
  .ribbon::before { left:10px; } .ribbon::after { right:10px; }

  .d-title { font-size:1rem; letter-spacing:4px; text-transform:uppercase; color:#a0762c; margin-bottom:16px; text-align:center; }
  .d-sub { font-style:italic; color:#8a6a2c; margin-bottom:12px; text-align:center; font-size:1.02rem; }
  .d-photo { text-align:center; margin-bottom:12px; }
  .d-photo img {
    width:92px; height:92px; object-fit:cover; border-radius:50%;
    border:3px solid #cda13a; box-shadow:0 4px 14px rgba(120,80,0,.3); background:#f3dfa8;
  }
  .d-name { text-align:center; font-size:1.8rem; font-weight:bold; color:#8c5a12; padding-bottom:6px; margin-bottom:18px; }
  .d-role { text-align:center; font-size:1.3rem; font-weight:bold; color:#7a5513; font-style:italic; margin-bottom:14px; }
  .d-head { text-align:center; font-size:2.4rem; font-weight:bold; color:#7a5513; line-height:1.1; margin-bottom:6px; }

  .d-nums { display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin-bottom:20px; }
  .medal {
    width:120px; padding:14px 6px; text-align:center; background:radial-gradient(circle at 50% 30%, #fff8e3, #f3dfa8);
    border:2px solid #cda13a; border-radius:50% 50% 14px 14px; box-shadow:0 4px 14px rgba(120,80,0,.25);
  }
  .medal .mv { font-size:2.6rem; font-weight:bold; color:#8c5a12; line-height:1; }
  .medal .mk { font-size:.62rem; letter-spacing:1px; color:#a0762c; margin-top:5px; text-transform:uppercase; }

  /* Расшифровка внутри грамоты */
  .read h3 {
    font-family:'Segoe UI',Arial,sans-serif; font-size:.95rem; letter-spacing:2px; text-transform:uppercase;
    color:#a0762c; text-align:center; margin:6px 0 14px;
  }
  .block { border:1px solid rgba(190,145,50,.45); background:rgba(255,255,255,.4); border-radius:10px; padding:14px 18px; margin-bottom:12px; }
  .block .bh { font-weight:bold; color:#8c5a12; font-size:1.02rem; margin-bottom:6px; }
  .block p { line-height:1.6; color:#5d4a1e; font-size:.95rem; margin-bottom:8px; }
  .block p:last-child { margin-bottom:0; }
  .mini-block { border:1px solid rgba(190,145,50,.35); background:rgba(255,255,255,.25); border-radius:8px; padding:10px 14px; margin-bottom:10px; }
  .mini-block .bh { font-weight:bold; color:#8c5a12; font-size:.95rem; }
  .mini-block p { line-height:1.5; color:#5d4a1e; font-size:.9rem; margin-top:4px; }

  .d-seal { text-align:center; margin-top:20px; font-family:'Segoe UI',Arial,sans-serif; font-size:.85rem; color:#7a5513; }

  .actions { text-align:center; margin-top:24px; }
  .btn2 { display:inline-block; padding:12px 28px; border-radius:12px; background:linear-gradient(135deg,#ffd166,#f4a261); color:#2a1448; font-weight:700; cursor:pointer; border:none; font-family:'Segoe UI',Arial,sans-serif; font-size:1rem; margin:6px; }
  .btn2:hover { transform:translateY(-2px); }
  .btn2.ghost { background:transparent; color:#ffd166; border:1px solid #ffd166; }

  footer { text-align:center; margin-top:34px; color:rgba(239,234,251,.4); font-size:.82rem; font-family:'Segoe UI',Arial,sans-serif; }

  @media(max-width:560px){ .d-head{font-size:1.7rem} .d-name{font-size:1.3rem} .diploma{padding:52px 18px 26px} .medal{width:96px} .medal .mv{font-size:2rem} }

  /* ===== ДЕКОР: салют и шарики на грамоте ===== */
  .decor { position:absolute; inset:0; pointer-events:none; z-index:6; }
  .decor svg { position:absolute; opacity:.95; }
  .fxtl { top:8px; left:8px; }
  .fxtr { top:8px; right:8px; }
  .fxbl { bottom:8px; left:8px; }
  .fxbr { bottom:8px; right:8px; }
  .bal-tl { top:4px; left:52px; }
  .bal-tr { top:4px; right:52px; }
  @media(max-width:560px){
    .bal-tl, .bal-tr { display:none; }
    .fxtl,.fxtr{ width:52px; } .fxbl,.fxbr{ width:44px; }
  }
  @media print {
    .decor svg { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .fxtl { top:6px; left:6px; width:52px; }
    .fxtr { top:6px; right:6px; width:52px; }
    .fxbl { bottom:6px; left:6px; width:44px; }
    .fxbr { bottom:6px; right:6px; width:44px; }
    .bal-tl { top:2px; left:34px; width:64px; }
    .bal-tr { top:2px; right:34px; width:64px; }
  }

  /* ===== ШАРИКИ И ФЕЙЕРВЕРК ===== */
  .celebrate { position:relative; }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
  .balloons { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:4; }
  .balloon {
    position:absolute; bottom:-70px; width:34px; height:44px; border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    opacity:.85; animation:floatUp linear infinite;
  }
  .balloon::after {
    content:""; position:absolute; left:50%; top:100%; width:2px; height:26px; background:rgba(0,0,0,.25); transform:translateX(-50%);
  }
  .balloon::before {
    content:""; position:absolute; left:50%; top:-7px; transform:translateX(-50%);
    border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:8px solid #fff; opacity:.9;
  }
  .b1 { left:3%; background:#e74c3c; animation-duration:9s; animation-delay:0s; }
  .b2 { left:13%; background:#f39c12; animation-duration:11s; animation-delay:1s; }
  .b3 { left:24%; background:#3498db; animation-duration:10s; animation-delay:2s; }
  .b4 { left:34%; background:#2ecc71; animation-duration:12s; animation-delay:.5s; }
  .b5 { left:45%; background:#e91e63; animation-duration:9.5s; animation-delay:1.5s; }
  .b6 { left:56%; background:#9b59b6; animation-duration:11.5s; animation-delay:3s; }
  .b7 { left:66%; background:#1abc9c; animation-duration:10.5s; animation-delay:.8s; }
  .b8 { left:77%; background:#f1c40f; animation-duration:9.8s; animation-delay:2.5s; }
  .b9 { left:87%; background:#ff6f61; animation-duration:12.5s; animation-delay:1.2s; }
  .b10 { left:95%; background:#8e44ad; animation-duration:10.2s; animation-delay:3.5s; }
  @keyframes floatUp {
    0% { transform:translateY(0) rotate(-4deg); }
    100% { transform:translateY(-120vh) rotate(4deg); }
  }
  .balloon:hover { animation-play-state:paused; }

  @media print {
    #fx, .balloons { display:none !important; }
  }

  /* ===== ПЕЧАТЬ: только грамота на одном листе ===== */
  @media print {
    @page { margin: 8mm; size: A4 portrait; }
    body { background:#fff; }
    header, .form-card, .actions, footer { display:none !important; }
    .wrap { max-width:100%; padding:0; margin:0; }
    .diploma-wrap { display:block !important; animation:none; }
    .diploma { box-shadow:none; border-radius:0; padding:14px 16px 10px; margin:0; }
    .diploma::before { inset:8px; }
    .diploma::after { inset:13px; }
    .ribbon { top:-16px; padding:6px 26px; font-size:.85rem; }
    .d-title { margin-bottom:8px; font-size:.85rem; }
    .d-sub { margin-bottom:6px; font-size:.9rem; }
    .d-photo { margin-bottom:6px; }
    .d-photo img { width:60px; height:60px; border-width:2px; }
    .d-name { font-size:1.3rem; margin-bottom:8px; padding-bottom:3px; }
    .d-role { font-size:1rem; margin-bottom:6px; }
    .d-head { font-size:1.5rem; margin-bottom:4px; }
    .d-nums { gap:14px; margin-bottom:10px; }
    .medal { width:84px; padding:8px 4px; }
    .medal .mv { font-size:1.7rem; }
    .medal .mk { font-size:.5rem; margin-top:2px; }
    .read h3 { font-size:.8rem; margin:4px 0 8px; }
    .block { padding:6px 10px; margin-bottom:6px; border-radius:6px; }
    .block .bh { font-size:.85rem; margin-bottom:3px; }
    .block p { font-size:.72rem; line-height:1.35; margin-bottom:4px; }
    .block p:last-child { margin-bottom:0; }
    .mini-block { padding:5px 10px; margin-bottom:5px; }
    .mini-block .bh { font-size:.8rem; }
    .mini-block p { font-size:.68rem; line-height:1.3; margin-top:2px; }
    .d-seal { margin-top:8px; font-size:.72rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔮 Нумерология</h1>
    <p>Подарочная грамота с раскладом по дате рождения</p>
  </header>

  <div class="form-card">
    <div class="row">
      <div class="col">
        <label for="bd">Дата рождения</label>
        <input type="date" id="bd">
      </div>
      <div class="col">
        <label for="year">Год для персонального года</label>
        <input type="number" id="year">
      </div>
    </div>
    <label for="name" style="margin-top:16px;">Фамилия и имя получателя грамоты</label>
    <input type="text" id="name" placeholder="Например: Бектасова Айгуль">
    <label for="photo">Фото (необязательно — появится в грамоте)</label>
    <input type="file" id="photo" accept="image/*" style="color:rgba(239,234,251,.6); margin-bottom:14px;">
    <button onclick="calculate()">Выдать грамоту ✨</button>
  </div>

  <div class="celebrate" id="celebrate">
    <canvas id="fx" width="800" height="600"></canvas>
    <div class="balloons" id="balloons">
      <span class="balloon b1"></span><span class="balloon b2"></span>
      <span class="balloon b3"></span><span class="balloon b4"></span>
      <span class="balloon b5"></span><span class="balloon b6"></span>
      <span class="balloon b7"></span><span class="balloon b8"></span>
      <span class="balloon b9"></span><span class="balloon b10"></span>
    </div>

    <div class="diploma-wrap" id="result">
      <div class="diploma" id="diploma">
        <div class="decor">
          <svg class="fxtl" viewBox="0 0 100 100" width="72" aria-hidden="true">
            <g stroke="#e74c3c" stroke-width="3" stroke-linecap="round">
              <line x1="50" y1="50" x2="20" y2="20"/><line x1="50" y1="50" x2="80" y2="20"/>
              <line x1="50" y1="50" x2="15" y2="55"/><line x1="50" y1="50" x2="85" y2="55"/>
              <line x1="50" y1="50" x2="30" y2="85"/><line x1="50" y1="50" x2="70" y2="85"/>
              <line x1="50" y1="50" x2="50" y2="12"/><line x1="50" y1="50" x2="50" y2="88"/>
            </g>
            <circle cx="20" cy="20" r="4" fill="#f39c12"/><circle cx="80" cy="20" r="4" fill="#2ecc71"/>
            <circle cx="15" cy="55" r="4" fill="#e91e63"/><circle cx="85" cy="55" r="4" fill="#3498db"/>
            <circle cx="30" cy="85" r="4" fill="#ffd166"/><circle cx="70" cy="85" r="4" fill="#9b59b6"/>
            <circle cx="50" cy="12" r="4" fill="#e74c3c"/><circle cx="50" cy="88" r="4" fill="#1abc9c"/>
          </svg>
          <svg class="fxtr" viewBox="0 0 100 100" width="72" aria-hidden="true">
            <g stroke="#2ecc71" stroke-width="3" stroke-linecap="round">
              <line x1="50" y1="50" x2="20" y2="20"/><line x1="50" y1="50" x2="80" y2="20"/>
              <line x1="50" y1="50" x2="15" y2="55"/><line x1="50" y1="50" x2="85" y2="55"/>
              <line x1="50" y1="50" x2="30" y2="85"/><line x1="50" y1="50" x2="70" y2="85"/>
              <line x1="50" y1="50" x2="50" y2="12"/><line x1="50" y1="50" x2="50" y2="88"/>
            </g>
            <circle cx="20" cy="20" r="4" fill="#3498db"/><circle cx="80" cy="20" r="4" fill="#e74c3c"/>
            <circle cx="15" cy="55" r="4" fill="#ffd166"/><circle cx="85" cy="55" r="4" fill="#9b59b6"/>
            <circle cx="30" cy="85" r="4" fill="#e91e63"/><circle cx="70" cy="85" r="4" fill="#f39c12"/>
            <circle cx="50" cy="12" r="4" fill="#2ecc71"/><circle cx="50" cy="88" r="4" fill="#e74c3c"/>
          </svg>
          <svg class="fxbl" viewBox="0 0 100 100" width="60" aria-hidden="true">
            <g stroke="#f39c12" stroke-width="3" stroke-linecap="round">
              <line x1="50" y1="50" x2="20" y2="20"/><line x1="50" y1="50" x2="80" y2="20"/>
              <line x1="50" y1="50" x2="15" y2="55"/><line x1="50" y1="50" x2="85" y2="55"/>
              <line x1="50" y1="50" x2="50" y2="12"/><line x1="50" y1="50" x2="50" y2="88"/>
            </g>
            <circle cx="20" cy="20" r="4" fill="#e74c3c"/><circle cx="80" cy="20" r="4" fill="#3498db"/>
            <circle cx="15" cy="55" r="4" fill="#ffd166"/><circle cx="85" cy="55" r="4" fill="#2ecc71"/>
            <circle cx="50" cy="12" r="4" fill="#9b59b6"/><circle cx="50" cy="88" r="4" fill="#e91e63"/>
          </svg>
          <svg class="fxbr" viewBox="0 0 100 100" width="60" aria-hidden="true">
            <g stroke="#e91e63" stroke-width="3" stroke-linecap="round">
              <line x1="50" y1="50" x2="20" y2="20"/><line x1="50" y1="50" x2="80" y2="20"/>
              <line x1="50" y1="50" x2="15" y2="55"/><line x1="50" y1="50" x2="85" y2="55"/>
              <line x1="50" y1="50" x2="50" y2="12"/><line x1="50" y1="50" x2="50" y2="88"/>
            </g>
            <circle cx="20" cy="20" r="4" fill="#1abc9c"/><circle cx="80" cy="20" r="4" fill="#ffd166"/>
            <circle cx="15" cy="55" r="4" fill="#e74c3c"/><circle cx="85" cy="55" r="4" fill="#9b59b6"/>
            <circle cx="50" cy="12" r="4" fill="#2ecc71"/><circle cx="50" cy="88" r="4" fill="#f39c12"/>
          </svg>

          <svg class="bal-tl" viewBox="0 0 120 150" width="88" aria-hidden="true">
            <path d="M28 40 C30 20 44 12 55 14" fill="none" stroke="#e74c3c" stroke-width="3"/>
            <path d="M30 38 C34 18 48 10 58 12" fill="none" stroke="#e74c3c" stroke-width="3"/>
            <ellipse cx="30" cy="30" rx="15" ry="19" fill="#e74c3c"/>
            <ellipse cx="52" cy="22" rx="13" ry="17" fill="#3498db"/>
            <path d="M26 30 L34 30 L30 22 Z" fill="#a8342b"/>
            <path d="M48 22 L56 22 L52 14 Z" fill="#2a6fa8"/>
            <line x1="30" y1="49" x2="30" y2="150" stroke="#000" stroke-width="1.5" opacity=".3"/>
            <line x1="52" y1="39" x2="52" y2="150" stroke="#000" stroke-width="1.5" opacity=".3"/>
          </svg>
          <svg class="bal-tr" viewBox="0 0 120 150" width="88" aria-hidden="true">
            <path d="M28 40 C30 20 44 12 55 14" fill="none" stroke="#f39c12" stroke-width="3"/>
            <path d="M30 38 C34 18 48 10 58 12" fill="none" stroke="#f39c12" stroke-width="3"/>
            <ellipse cx="30" cy="30" rx="15" ry="19" fill="#f39c12"/>
            <ellipse cx="52" cy="22" rx="13" ry="17" fill="#2ecc71"/>
            <path d="M26 30 L34 30 L30 22 Z" fill="#c07a0e"/>
            <path d="M48 22 L56 22 L52 14 Z" fill="#1f9e5b"/>
            <line x1="30" y1="49" x2="30" y2="150" stroke="#000" stroke-width="1.5" opacity=".3"/>
            <line x1="52" y1="39" x2="52" y2="150" stroke="#000" stroke-width="1.5" opacity=".3"/>
          </svg>
        </div>
        <div class="ribbon">🎁 Подарочная грамота</div>
        <div class="d-title">Нумерологическая характеристика</div>
        <div class="d-sub">настоящим подтверждается, что</div>
        <div class="d-photo" id="d-photo"><img id="d-photo-img" alt="Фото получателя"></div>
        <div class="d-name" id="d-name"></div>
        <div class="d-role">является — <span id="d-role"></span></div>
        <div class="d-head">Число жизненного пути — <span id="d-life-num"></span></div>
        <div class="d-nums" id="d-nums"></div>
        <div class="read" id="d-read"></div>
        <div class="d-seal"><span>✦</span> Расчёт произведён по дате рождения <span>✦</span></div>
      </div>

      <div class="actions">
        <button class="btn2 ghost" onclick="window.print()">🖨️ Распечатать грамоту</button>
      </div>
    </div>
  </div>

  <footer>Подарочная грамота нумерологии — красивый и полезный подарок</footer>
</div>

<script>
  var y = new Date().getFullYear();
  document.getElementById('year').value = y;

  var LIFE = {
    1:{ role:'Истинный лидер',motto:'Я начинаю',ess:'Единица — энергия лидера, первопроходца и первопричины. Люди этого числа самостоятельны, решительны и независимы. Они не ждут готовых решений, а создают их сами, открывают новые пути и ведут за собой остальных.',str:'Сильная воля, смелость, инициативность, способность быстро принимать решения и не бояться ответственности. Вы умеете вдохновлять людей и заражать их своим энтузиазмом.',car:'Вам подходит всё, где нужно начинать новое: собственный бизнес, руководство, управление проектами, инновации. Лучше всего вы раскрываетесь, когда действуете самостоятельно, а не по чужой указке. Деньги приходят к вам через активность и смелые шаги.',lov:'В отношениях вы — лидер и защитник. Ищете партнёра, который не будет бояться вашей силы и при этом сохранит собственную индивидуальность. Учитесь уступать и проявлять нежность — это ваш главный урок.',adv:'Ваш главный вызов — гордыня и нетерпение. Помните: великие лидеры умеют слушать. Доверяйте команде и близким, и успех будет в разы больше.'},
    2:{ role:'Дипломат и хранитель гармонии',motto:'Я чувствую и объединяю',ess:'Двойка — число дипломата, партнёра и хранителя мира. Вы чувствительны, тактичны и обладаете редким даром слышать людей. Ваша сила — в создании гармонии, союзов и доверительных отношений.',str:'Эмпатия, умение договариваться, терпение, внимание к деталям. Вы умеете сглаживать конфликты и объединять даже противоположные точки зрения.',car:'Вам подходят профессии, связанные с людьми и сотрудничеством: переговоры, психология, искусство, работа в паре и в команде. Деньги приходят через партнёрство и репутацию надёжного человека.',lov:'Вы — идеальный партнёр: чуткий, преданный, заботливый. Вам важно, чтобы вас понимали и ценили. Избегайте растворяться в других полностью — сохраняйте свои желания.',adv:'Главный вызов — неуверенность и склонность к сомнениям. Доверяйте своей интуиции: ваши решения, принятые с душой, почти всегда верные.'},
    3:{ role:'Творец и душа компании',motto:'Я выражаю себя',ess:'Тройка — число творчества, общения и радости. Вы яркая, общительная и вдохновляющая личность. Умеете превращать обычное в праздник и дарить людям свет и позитив.',str:'Обаяние, остроумие, артистизм, дар слова. Вы умеете выражать мысли так, что вас слушают с удовольствием.',car:'Ваша стихия — творчество: искусство, музыка, литература, реклама, преподавание, всё, что связано с общением и самовыражением. Деньги приходят через талант и умение быть замеченным.',lov:'Вы — душа любой компании, легко влюбляете и легко увлекаетесь. Вам нужен партнёр, который будет разделять вашу жизнерадостность и давать стабильность.',adv:'Главный вызов — разбросанность и поверхностность. Доводите начатое до конца, сосредоточьтесь на одном проекте — и ваш талант принесёт большие плоды.'},
    4:{ role:'Строитель и труженик',motto:'Я строю и укрепляю',ess:'Четвёрка — число строителя и труженика. Вы надёжны, практичны и обладаете удивительной способностью превращать идеи в прочные конструкции. Ваш фундамент — порядок, дисциплина и терпение.',str:'Трудолюбие, честность, системность, выносливость. На вас всегда можно положиться, и люди это чувствуют.',car:'Вам подходят сферы, требующие основательности: строительство, финансы, производство, юриспруденция, любая системная работа. Деньги приходят к вам постепенно, но зато стабильно.',lov:'Вы — верный и преданный партнёр. Создаёте крепкий дом и надёжный тыл. Учитесь открыто говорить о чувствах и не бояться проявлять эмоции.',adv:'Главный вызов — консерватизм и страх перемен. Мир меняется — разрешите себе новое. Иногда лучшие возможности приходят через неожиданные повороты.'},
    5:{ role:'Искатель приключений и свободная душа',motto:'Я свободен и познаю',ess:'Пятёрка — число свободы, перемен и любознательности. Вы авантюрист по натуре: любите путешествия, новые знакомства и живые впечатления. Ваша стихия — движение.',str:'Адаптивность, общительность, смелость, живой ум. Вы быстро схватываете новое и легко находите общий язык с любыми людьми.',car:'Вам подходят динамичные сферы: туризм, торговля, коммуникации, журналистика, всё, что даёт разнообразие. Деньги приходят через контакты и умение быть в нужное время в нужном месте.',lov:'Вы — свободолюбивы и не выносите рамок. Вам нужен партнёр, который будет уважать вашу независимость и не станет «приручать».',adv:'Главный вызов — непостоянство. Учитесь дисциплине и доведению дел до конца. Собранность превратит ваш талант в настоящий успех.'},
    6:{ role:'Хранитель семьи и домашнего очага',motto:'Я люблю и забочусь',ess:'Шестёрка — число любви, заботы и гармонии. Вы ответственны, душевны и умеете создавать красоту и уют вокруг себя. Ваш дар — оберегать близких и налаживать мир.',str:'Честность, сострадание, чувство красоты, надёжность. Люди тянутся к вам за теплом и поддержкой.',car:'Вам подходят сферы заботы: семья, медицина, образование, дизайн, красота, гостеприимство. Деньги приходят через внимание к людям и качество вашего труда.',lov:'Вы — прирождённый хранитель семьи. Любите глубоко и верно. Помните: забота о других не должна отменять заботу о себе.',adv:'Главный вызов — гиперответственность и чувство вины. Вы не обязаны решать проблемы всех. Позвольте близким быть сильными — и дышите свободно.'},
    7:{ role:'Исследователь глубины и истины',motto:'Я познаю глубину',ess:'Семёрка — число исследователя, мыслителя и искателя истины. Вы склонны к глубоким размышлениям, духовным практикам и анализу. Вам нужно время наедине с собой, чтобы наполниться.',str:'Интеллект, интуиция, аналитический ум, способность видеть суть вещей. Вы задаёте вопросы, которые другие не решаются задать.',car:'Вам подходят наука, исследования, аналитика, IT, духовные и философские сферы, преподавание. Деньги приходят через знания и экспертизу, а не через суету.',lov:'Вам нужен умный и уважающий ваше пространство партнёр. Вы не терпите поверхностности и цените глубокую связь.',adv:'Главный вызов — замкнутость и изоляция. Ваши знания нужны миру. Делитесь ими, не держите всё внутри.'},
    8:{ role:'Мастер силы и успеха',motto:'Я достигаю и управляю',ess:'Восьмёрка — число силы, власти и материального успеха. Вы амбициозны, деловиты и обладаете даром управлять ресурсами и людьми. Ваша задача — строить крупные, весомые дела.',str:'Деловая хватка, стратегическое мышление, целеустремлённость, умение зарабатывать. Вы умеете видеть возможности там, где другие видят проблемы.',car:'Вам подходят бизнес, финансы, управление, недвижимость, большие проекты. Деньги — ваша стихия, но приходят они через дисциплину и грамотные решения.',lov:'Вы сильная личность, ищете партнёра, равного себе. Отношения с вами — это союз двух независимых людей, строящих общее дело.',adv:'Главный урок — использовать силу во благо. Власть без мудрости разрушает, мудрость с властью — созидает. Будьте щедры и справедливы.'},
    9:{ role:'Мудрый наставник и благодетель',motto:'Я завершаю и дарю мудрость',ess:'Девятка — число завершения, мудрости и щедрости. Вы великодушны, сострадательны и обладаете даром видеть общую картину жизни. Ваш путь — помогать, учить и вдохновлять.',str:'Широта души, интуиция, творческая сила, умение отпускать. Вы завершаете этапы и открываете дорогу новому.',car:'Вам подходят благотворительность, искусство, образование, наставничество, международные дела. Деньги приходят как признание вашего вклада в мир.',lov:'Вы любите глубоко и самоотверженно. Ищете партнёра, разделяющего ваши идеалы. Учитесь принимать заботу, а не только отдавать.',adv:'Главный вызов — чувство, что вы должны всем помочь. Ваша миссия велика, но у каждого свой путь. Освободитесь от лишнего — и притянете своё.'},
    11:{ role:'Духовный вдохновитель',motto:'Я вдохновляю',ess:'11 — мастер-число вдохновения и интуиции. Вы обладаете редким духовным зрением и умеете вдохновлять людей одним своим присутствием. Ваша задача — нести свет и новые идеи.',str:'Высокая интуиция, чувствительность, харизма, способность видеть суть. Вы чувствуете людей и ситуации глубже, чем другие.',car:'Вам подходят сферы, где важны идеи и вдохновение: искусство, духовность, психология, преподавание, лидерство. Деньги приходят, когда вы верите в свою миссию.',lov:'Ваша чувствительность — дар и испытание. Ищите партнёра, который даст вам опору и не будет подавлять вашу тонкость.',adv:'Берегите нервную систему — вы остро всё воспринимаете. Учитесь заземляться: спорт, природа, рутина. Заземлённый мастер творит чудеса.'},
    22:{ role:'Строитель великих дел',motto:'Я строю великое',ess:'22 — мастер-число строителя великих дел. Вы соединяете интуицию и практичность и способны воплощать масштабные мечты в реальность. Вам под силу то, что другим кажется невозможным.',str:'Организаторский талант, видение перспективы, практическая мудрость, надёжность. Вы умеете превращать мечты в проекты, а проекты — в результаты.',car:'Вам подходят крупные проекты: строительство, большая недвижимость, корпорации, масштабные идеи. Деньги приходят через большие, но продуманные начинания.',lov:'Вы создаёте прочные и значимые отношения. Вам нужен партнёр, разделяющий ваши масштабные цели и поддерживающий вас в пути.',adv:'Не бойтесь мечтать масштабно — именно вам дано воплощать великое. Но помните о балансе: забота о близких так же важна, как и великие стройки.'},
    33:{ role:'Учитель любви и служения',motto:'Я учу любви',ess:'33 — мастер-число учителя любви и служения. Вы обладаете огромным сердцем и редким даром наставничества, способны исцелять словом и делом, вести людей к лучшему.',str:'Сострадание, мудрость, духовная сила, умение вдохновлять. Ваша любовь преображает окружающих и обстоятельства.',car:'Вам подходят сферы, где вы дарите знание и свет: образование, медицина, психология, духовное наставничество, благотворительность.',lov:'Вы любите безгранично и безусловно. Ищите партнёра, который сможет стать вам равным и не будет лишь «принимать» вашу заботу.',adv:'Ваша миссия огромна — но не забывайте о собственных потребностях. Служение не должно истощать вас. Наполняйте себя, чтобы нести свет дальше.'}

  var CYR = {А:1,Б:2,В:3,Г:4,Д:5,Е:6,Ё:7,Ж:8,З:9,И:1,Й:2,К:3,Л:4,М:5,Н:6,О:7,П:8,Р:9,С:1,Т:2,У:3,Ф:4,Х:5,Ц:6,Ч:7,Ш:8,Щ:9,Ъ:1,Ы:2,Ь:3,Э:4,Ю:5,Я:6};
  var LAT = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8};
  var VOWELS_RU = 'АЕЁИОУЫЭЮЯаеёиоуыэюя';
  var VOWELS_EN = 'AEIOUaeiou';

  function reduce(n) {
    while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
      n = String(n).split('').reduce(function(s,d){return s+ +d;},0);
    }
    return n;
  }
  function charVal(ch) {
    var u = ch.toUpperCase();
    if (CYR[u] !== undefined) return CYR[u];
    if (LAT[u] !== undefined) return LAT[u];
    return 0;
  }
  function isVowel(ch) { return VOWELS_RU.indexOf(ch) >= 0 || VOWELS_EN.indexOf(ch) >= 0; }
  function medal(v, k) {
    return '<div class="medal"><div class="mv">' + v + '</div><div class="mk">' + k + '</div></div>';
  }
  function block(title, html) {
    return '<div class="block"><div class="bh">' + title + '</div>' + html + '</div>';
  }

  function calculate() {
    var bd = document.getElementById('bd').value;
    if (!bd) { alert('Укажите дату рождения'); return; }
    var parts = bd.split('-');
    var d = +parts[2], m = +parts[1], y = +parts[0];

    var name = document.getElementById('name').value.trim() || 'Дорогой друг';
    document.getElementById('d-name').textContent = name;

    var photo = document.getElementById('photo');
    var photoImg = document.getElementById('d-photo-img');
    if (photo.files && photo.files.length > 0) {
      var reader = new FileReader();
      reader.onload = function(e){ photoImg.src = e.target.result; };
      reader.readAsDataURL(photo.files[0]);
      photoImg.style.display = 'block';
    } else {
      photoImg.removeAttribute('src');
      photoImg.style.display = 'none';
    }

    var life = reduce(d + m + y);
    var bday = reduce(d);
    var py = reduce(d + m + (+document.getElementById('year').value));

    var lf = LIFE[life] || LIFE[life > 9 ? reduce(life) : life];
    document.getElementById('d-life-num').textContent = life;
    document.getElementById('d-role').textContent = lf ? lf.role : '';
    document.getElementById('d-nums').innerHTML =
      medal(life, 'Жизненный путь') +
      medal(bday, 'День рождения') +
      medal(py, 'Персональный год');

    var read = '<h3>Расшифровка чисел</h3>';
    read += block('Суть числа ' + life + ' — «' + lf.motto + '»', '<p>' + lf.ess + '</p>');
    read += block('Сильные стороны', '<p>' + lf.str + '</p>');
    read += block('Карьера и деньги', '<p>' + lf.car + '</p>');
    read += block('Любовь и отношения', '<p>' + lf.lov + '</p>');
    read += block('Совет', '<p>' + lf.adv + '</p>');
    read += '<div class="mini-block"><div class="bh">' + (DAY[bday] ? DAY[bday].n : '') + '</div><p>' + (DAY[bday] ? DAY[bday].t : '') + '</p></div>';
    read += '<div class="mini-block"><div class="bh">' + (PYEAR[py] ? PYEAR[py].n : '') + '</div><p>' + (PYEAR[py] ? PYEAR[py].t : '') + '</p></div>';

    var nameInput = document.getElementById('name').value.trim();
    if (nameInput) {
      var letters = nameInput.replace(/[^а-яА-ЯёЁa-zA-Z]/g,'');
      var sumTotal=0, sumVow=0, sumCon=0;
      for (var i=0;i<letters.length;i++) {
        var cv = charVal(letters[i]);
        if (!cv) continue;
        sumTotal += cv;
        if (isVowel(letters[i])) sumVow += cv; else sumCon += cv;
      }
      if (sumTotal > 0) {
        var expr = reduce(sumTotal), soul = reduce(sumVow), pers = reduce(sumCon);
        read += '<div class="mini-block"><div class="bh">Число судьбы (имя) — ' + expr + '</div><p>' + (EXPR[expr]||'') + '</p></div>';
        read += '<div class="mini-block"><div class="bh">Число души — ' + soul + '</div><p>' + (SOUL[soul]||'') + '</p></div>';
        read += '<div class="mini-block"><div class="bh">Число личности — ' + pers + '</div><p>' + (PERS[pers]||'') + '</p></div>';
      }
    }
    document.getElementById('d-read').innerHTML = read;

    document.getElementById('result').classList.add('show');
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
    startFireworks();
  }

  /* ===== ФЕЙЕРВЕРК ===== */
  var fxRunning = false, fxTimer = null;
  function startFireworks() {
    var c = document.getElementById('fx');
    var rect = document.getElementById('celebrate').getBoundingClientRect();
    c.width = Math.max(rect.width, 400);
    c.height = Math.max(rect.height, 300);
    var ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    fxRunning = true;
    var parts = [];
    function spawn() {
      var x = c.width * (0.15 + Math.random() * 0.7);
      var y = c.height * (0.15 + Math.random() * 0.4);
      var colors = ['#ffd166','#e74c3c','#2ecc71','#3498db','#e91e63','#f39c12','#9b59b6'];
      var col = colors[Math.floor(Math.random()*colors.length)];
      var n = 30 + Math.floor(Math.random()*25);
      for (var i=0;i<n;i++) {
        var a = Math.random()*Math.PI*2;
        var sp = 1.5 + Math.random()*3.5;
        parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.012+Math.random()*0.015,col:col});
      }
    }
    var maxBursts = 6;
    var burstCount = 0;
    var interval = setInterval(function(){ if (burstCount < maxBursts) { spawn(); burstCount++; } }, 420);
    function frame() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (var i=parts.length-1;i>=0;i--) {
        var p = parts[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.045;
        p.life -= p.decay;
        if (p.life <= 0) { parts.splice(i,1); continue; }
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (parts.length > 0 || burstCount < maxBursts) {
        fxTimer = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, c.width, c.height);
        clearInterval(interval);
        fxRunning = false;
      }
    }
    if (fxTimer) cancelAnimationFrame(fxTimer);
    frame();
  }
  window.addEventListener('resize', function(){
    if (fxRunning) {
      var c = document.getElementById('fx');
      var rect = document.getElementById('celebrate').getBoundingClientRect();
      c.width = Math.max(rect.width, 400);
      c.height = Math.max(rect.height, 300);
    }
  });
</script>
