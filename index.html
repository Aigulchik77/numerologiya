<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нумерология — подарочная грамота</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Georgia','Times New Roman',serif; background:linear-gradient(160deg,#0d0a1f 0%,#1b1035 45%,#2a1448 100%); color:#efeafb; min-height:100vh; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 16px 60px; }
  header { text-align:center; margin-bottom:28px; }
  header h1 { font-size:2.1rem; color:#ffd166; letter-spacing:2px; font-family:'Georgia',serif; }
  header p { color:rgba(239,234,251,.7); margin-top:6px; font-size:1rem; }

  .form-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,209,102,.25); border-radius:16px; padding:24px; margin-bottom:28px; font-family:'Segoe UI',Arial,sans-serif; }
  label { display:block; font-size:.9rem; color:#ffd166; margin-bottom:6px; font-weight:600; }
  input[type=date], input[type=text], input[type=number] { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; font-size:1.05rem; }
  input[type=text] { margin-bottom:14px; }
  input::placeholder { color:rgba(239,234,251,.4); }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row .col { flex:1; min-width:150px; }
  button { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#ffd166,#f4a261); color:#2a1448; font-size:1.1rem; font-weight:700; cursor:pointer; margin-top:18px; transition:transform .15s; font-family:'Segoe UI',Arial,sans-serif; }
  button:hover { transform:translateY(-2px); }

  /* ============ ГРАМОТА ============ */
  .diploma-wrap { display:none; }
  .diploma-wrap.show { display:block; animation:fade .6s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

  .diploma {
    position:relative;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,214,130,.14), transparent 60%),
      linear-gradient(155deg,#fdf6e3 0%, #f7ecc8 45%, #f3e3b3 100%);
    color:#4a3512;
    border-radius:20px;
    padding:56px 40px 40px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 0 3px rgba(214,168,60,.35);
    position:relative;
  }
  .diploma::before {
    content:""; position:absolute; inset:14px; border:2px solid rgba(190,145,50,.55); border-radius:12px; pointer-events:none;
  }
  .diploma::after {
    content:""; position:absolute; inset:20px; border:1px solid rgba(190,145,50,.35); border-radius:8px; pointer-events:none;
  }
  .ribbon {
    position:absolute; top:-22px; left:50%; transform:translateX(-50%) rotate(-3deg);
    background:linear-gradient(135deg,#c0392b,#e74c3c); color:#fff; font-family:'Segoe UI',Arial,sans-serif;
    font-weight:800; font-size:1.05rem; letter-spacing:3px; text-transform:uppercase;
    padding:10px 32px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.35); white-space:nowrap;
  }
  .ribbon::before, .ribbon::after {
    content:"✦"; position:absolute; font-size:.8rem; top:50%; transform:translateY(-50%); color:#ffd166;
  }
  .ribbon::before { left:10px; } .ribbon::after { right:10px; }

  .d-title { font-size:1.05rem; letter-spacing:4px; text-transform:uppercase; color:#a0762c; margin-bottom:18px; }
  .d-head { font-size:2.6rem; font-weight:bold; color:#7a5513; line-height:1.1; margin-bottom:10px; }
  .d-sub { font-style:italic; color:#8a6a2c; margin-bottom:14px; font-size:1.05rem; }
  .d-name { font-size:1.9rem; font-weight:bold; color:#8c5a12; border-bottom:2px solid rgba(190,145,50,.5); display:inline-block; padding:0 26px 6px; margin-bottom:22px; }
  .d-nums { display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin-bottom:18px; }
  .medal {
    width:118px; padding:14px 6px; background:radial-gradient(circle at 50% 30%, #fff8e3, #f3dfa8);
    border:2px solid #cda13a; border-radius:50% 50% 14px 14px; box-shadow:0 4px 14px rgba(120,80,0,.25);
  }
  .medal .mv { font-size:2.6rem; font-weight:bold; color:#8c5a12; line-height:1; }
  .medal .mk { font-size:.62rem; letter-spacing:1px; color:#a0762c; margin-top:5px; text-transform:uppercase; }
  .d-desc { max-width:560px; margin:0 auto 22px; font-size:.98rem; line-height:1.65; color:#5d4a1e; background:rgba(255,255,255,.35); border-radius:12px; padding:16px 20px; }
  .d-seal {
    display:inline-flex; align-items:center; gap:8px; font-family:'Segoe UI',Arial,sans-serif; font-size:.85rem;
    color:#7a5513; border:2px solid rgba(190,145,50,.5); padding:8px 18px; border-radius:999px; background:rgba(255,255,255,.4);
  }
  .d-seal .star { color:#d4a017; font-size:1.1rem; }

  .extra { margin-top:16px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .mini { background:rgba(255,255,255,.06); border:1px solid rgba(255,209,102,.25); border-radius:12px; padding:14px 20px; text-align:center; font-family:'Segoe UI',Arial,sans-serif; }
  .mini .v { font-size:2rem; font-weight:800; color:#ffd166; }
  .mini .k { font-size:.78rem; color:rgba(239,234,251,.75); text-transform:uppercase; letter-spacing:1px; }
  .mini p { font-size:.8rem; color:rgba(239,234,251,.55); margin-top:6px; line-height:1.4; max-width:240px; }

  .actions { text-align:center; margin-top:24px; }
  .btn2 { display:inline-block; padding:12px 28px; border-radius:12px; background:linear-gradient(135deg,#ffd166,#f4a261); color:#2a1448; font-weight:700; cursor:pointer; border:none; font-family:'Segoe UI',Arial,sans-serif; font-size:1rem; margin:6px; }
  .btn2:hover { transform:translateY(-2px); }
  .btn2.ghost { background:transparent; color:#ffd166; border:1px solid #ffd166; }

  footer { text-align:center; margin-top:34px; color:rgba(239,234,251,.4); font-size:.82rem; font-family:'Segoe UI',Arial,sans-serif; }
  @media(max-width:560px){ .d-head{font-size:1.9rem} .d-name{font-size:1.4rem} .diploma{padding:48px 20px 30px} .medal{width:96px} .medal .mv{font-size:2rem} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔮 Нумерология</h1>
    <p>Подарочная грамота с раскладом по дате рождения</p>
  </header>

  <div class="form-card">
    <div class="row">
      <div class="col">
        <label for="bd">Дата рождения</label>
        <input type="date" id="bd">
      </div>
      <div class="col">
        <label for="year">Год для персонального года</label>
        <input type="number" id="year">
      </div>
    </div>
    <label for="name" style="margin-top:16px;">Имя получателя грамоты</label>
    <input type="text" id="name" placeholder="Например: Айгуль">
    <button onclick="calculate()">Выдать грамоту ✨</button>
  </div>

  <div class="diploma-wrap" id="result">
    <div class="diploma">
      <div class="ribbon">🎁 Подарочная грамота</div>
      <div class="d-title">Гороскоп нумерологии</div>
      <div class="d-head">Число жизненного пути</div>
      <div class="d-sub">настоящим подтверждается, что</div>
      <div class="d-name" id="d-name"></div>
      <div class="d-nums" id="d-nums"></div>
      <div class="d-desc" id="d-desc"></div>
      <div class="d-seal"><span class="star">✦</span> Расчёт произведён по дате рождения <span class="star">✦</span></div>
    </div>

    <div class="extra" id="extra"></div>

    <div class="actions">
      <button class="btn2 ghost" onclick="window.print()">🖨️ Распечатать грамоту</button>
    </div>
  </div>

  <footer>Подарочная грамота нумерологии — красивый и полезный подарок</footer>
</div>

<script>
  var y = new Date().getFullYear();
  document.getElementById('year').value = y;

  var LIFE = {
    1:'Единица — энергия лидера и первооткрывателя. Вы самостоятельны, целеустремлённы, умеете начинать с нуля и вести за собой. Вам подходит собственное дело, управление, активная позиция. Избегайте гордыни — ваш главный урок учиться слушать других.',
    2:'Двойка — число дипломата и партнёра. Вы чувствительны, тактичны, хорошо понимаете людей. Ваша сила в умении договариваться, создавать союзы и гармонию вокруг себя. Избегайте сомнений в себе — решения вам лучше удаются в сотрудничестве.',
    3:'Тройка — число творчества и общения. Вы яркий, общительный, вдохновляющий человек. Реализуйте себя через творчество, слово, искусство, обучение. Избегайте разбросанности — доводите начатое до конца, и успех придёт.',
    4:'Четвёрка — число строителя и труженика. Вы надёжны, практичны, умеете создавать прочный фундамент в любом деле. Ваша сила в порядке, дисциплине и терпении. Не бойтесь перемен — иногда они открывают лучшие возможности.',
    5:'Пятёрка — число свободы и перемен. Вы любознательны, любите путешествия, новые впечатления, живое общение. Ваша стихия — движение и приключения. Учитесь доводить дело до конца, не размениваясь на мелочи.',
    6:'Шестёрка — число любви и заботы. Вы ответственны, душевны, умеете создавать уют и гармонию дома и на работе. Ваш дар — забота о близких и красота вокруг. Помните: заботиться нужно и о себе, не только о других.',
    7:'Семёрка — число исследователя и мыслителя. Вы склонны к глубоким размышлениям, духовности, науке, анализу. Вам важно личное пространство и время наедине с собой. Делитесь своим знанием с миром — оно нужно людям.',
    8:'Восьмёрка — число силы и материального успеха. Вы амбициозны, деловиты, умеете зарабатывать и управлять ресурсами. Вам подходит бизнес, финансы, большие проекты. Главный урок — использовать силу во благо, а не ради власти.',
    9:'Девятка — число завершения и мудрости. Вы великодушны, сострадательны, умеете отпускать и завершать этапы. Ваш путь — помогать людям, делиться опытом, вдохновлять. Учитесь принимать помощь, а не только отдавать.',
    11:'11 — мастер-число вдохновения. У вас развитая интуиция и духовная восприимчивость, вы умеете вдохновлять людей. Ваша задача — нести свет и идеи в мир. Берегите нервную систему и учитесь заземляться в повседневности.',
    22:'22 — мастер-число строителя великого. Вы способны воплощать масштабные мечты в реальность, сочетая интуицию и практичность. Вам под силу большие проекты и глобальные цели. Не бойтесь мечтать масштабно.',
    33:'33 — мастер-число учителя любви. Вы обладаете огромным сердцем и даром наставничества, умеете исцелять словом и делом. Ваша миссия — служить людям через любовь и знания. Помните о собственных потребностях.'
  };
  var DAY = {
    1:'Лидер от природы — начинаете и ведёте.',
    2:'Мягкость и такт — умеете слышать других.',
    3:'Яркость и творчество — притягиваете людей.',
    4:'Практичность и надёжность — строит фундамент.',
    5:'Свобода и движение — любите перемены.',
    6:'Забота и ответственность — храните семью.',
    7:'Глубина и анализ — живёте в поиске истины.',
    8:'Сила и ресурсы — умеете достигать целого.',
    9:'Мудрость и щедрость — завершаете и делитесь.',
    11:'Интуиция и вдохновение — видите больше других.',
    22:'Практическое видение — строите большое.',
    33:'Любовь и служение — дарите свет окружающим.'
  };
  var PYEAR = {
    1:'Новые начинания: действуйте, ставьте цели, меняйте жизнь.',
    2:'Сотрудничество: терпение, партнёрство, мягкое развитие.',
    3:'Творчество и общение: самовыражение, радость, знакомства.',
    4:'Строительство: труд, порядок, укрепление фундамента.',
    5:'Перемены: свобода, путешествия, смелые решения.',
    6:'Семья и забота: дом, отношения, ответственность.',
    7:'Внутренняя работа: анализ, учёба, духовный рост.',
    8:'Успех: финансы, результат, деловая активность.',
    9:'Завершение: отпустите старое, чтобы пришло новое.'
  };
  var EXPR = {
    1:'Самостоятельность, амбиции, лидерство в делах.',
    2:'Дипломатия, сотрудничество, чуткость к людям.',
    3:'Творчество, обаяние, дар слова.',
    4:'Надёжность, системность, трудолюбие.',
    5:'Коммуникабельность, гибкость, любовь к свободе.',
    6:'Ответственность, забота, гармония.',
    7:'Глубина, аналитика, духовность.',
    8:'Деловая хватка, умение управлять ресурсами.',
    9:'Мудрость, сострадание, влияние на людей.',
    11:'Интуиция, вдохновение, яркая харизма.',
    22:'Масштабные проекты, организаторский талант.'
  };
  var SOUL = {
    1:'Желание быть первым, независимость, смелость.',
    2:'Желание мира и близких отношений.',
    3:'Желание радости, творчества, общения.',
    4:'Желание стабильности и порядка.',
    5:'Желание свободы, путешествий, разнообразия.',
    6:'Желание любви, семьи, гармонии.',
    7:'Желание знаний, уединения, смысла.',
    8:'Желание успеха и материальной независимости.',
    9:'Желание служить и вдохновлять.',
    11:'Желание духовной миссии, высокие идеалы.'
  };
  var PERS = {
    1:'Выглядите решительно, впечатление лидера.',
    2:'Воспринимаетесь мягко, дипломатично, дружелюбно.',
    3:'Кажетесь лёгким, ярким, общительным.',
    4:'Воспринимаетесь как надёжный и серьёзный человек.',
    5:'Кажетесь свободолюбивым, живым, интересным.',
    6:'Воспринимаетесь как ответственный и тёплый человек.',
    7:'Кажетесь загадочным, глубоким, независимым.',
    8:'Воспринимаетесь как уверенный и деловой человек.',
    9:'Кажетесь мудрым, открытым, значимым.',
    11:'Воспринимаетесь как вдохновляющая и необычная личность.'
  };

  var CYR = {А:1,Б:2,В:3,Г:4,Д:5,Е:6,Ё:7,Ж:8,З:9,И:1,Й:2,К:3,Л:4,М:5,Н:6,О:7,П:8,Р:9,С:1,Т:2,У:3,Ф:4,Х:5,Ц:6,Ч:7,Ш:8,Щ:9,Ъ:1,Ы:2,Ь:3,Э:4,Ю:5,Я:6};
  var LAT = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8};
  var VOWELS_RU = 'АЕЁИОУЫЭЮЯаеёиоуыэюя';
  var VOWELS_EN = 'AEIOUaeiou';

  function reduce(n) {
    while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
      n = String(n).split('').reduce(function(s,d){return s+ +d;},0);
    }
    return n;
  }
  function charVal(ch) {
    var u = ch.toUpperCase();
    if (CYR[u] !== undefined) return CYR[u];
    if (LAT[u] !== undefined) return LAT[u];
    return 0;
  }
  function isVowel(ch) { return VOWELS_RU.indexOf(ch) >= 0 || VOWELS_EN.indexOf(ch) >= 0; }
  function medal(v, k) {
    return '<div class="medal"><div class="mv">' + v + '</div><div class="mk">' + k + '</div></div>';
  }

  function calculate() {
    var bd = document.getElementById('bd').value;
    if (!bd) { alert('Укажите дату рождения'); return; }
    var parts = bd.split('-');
    var d = +parts[2], m = +parts[1], y = +parts[0];

    var name = document.getElementById('name').value.trim() || 'Дорогой друг';
    document.getElementById('d-name').textContent = name;

    var life = reduce(d + m + y);
    var bday = reduce(d);
    var py = reduce(d + m + (+document.getElementById('year').value));

    document.getElementById('d-nums').innerHTML =
      medal(life, 'Жизненный путь') +
      medal(bday, 'День рождения') +
      medal(py, 'Персональный год');
    document.getElementById('d-desc').textContent = LIFE[life];

    var extra = document.getElementById('extra');
    extra.innerHTML =
      '<div class="mini"><div class="v">' + bday + '</div><div class="k">Число дня рождения</div><p>' + (DAY[bday]||'') + '</p></div>' +
      '<div class="mini"><div class="v">' + py + '</div><div class="k">Персональный год</div><p>' + (PYEAR[py]||'') + '</p></div>';

    var nameInput = document.getElementById('name').value.trim();
    if (nameInput) {
      var letters = nameInput.replace(/[^а-яА-ЯёЁa-zA-Z]/g,'');
      var sumTotal=0, sumVow=0, sumCon=0;
      for (var i=0;i<letters.length;i++) {
        var cv = charVal(letters[i]);
        if (!cv) continue;
        sumTotal += cv;
        if (isVowel(letters[i])) sumVow += cv; else sumCon += cv;
      }
      if (sumTotal > 0) {
        var expr = reduce(sumTotal), soul = reduce(sumVow), pers = reduce(sumCon);
        extra.innerHTML +=
          '<div class="mini"><div class="v">' + expr + '</div><div class="k">Число судьбы</div><p>' + (EXPR[expr]||'') + '</p></div>' +
          '<div class="mini"><div class="v">' + soul + '</div><div class="k">Число души</div><p>' + (SOUL[soul]||'') + '</p></div>' +
          '<div class="mini"><div class="v">' + pers + '</div><div class="k">Число личности</div><p>' + (PERS[pers]||'') + '</p></div>';
      }
    }

    document.getElementById('result').classList.add('show');
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
  }
</script>
</body>
</html>
